[project]
name = "my-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "openai>=3.51.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "tkinterdnd2>=0.7.0",
]

[tool.pytest.ini_options]
# 저장소 맨 위를 import 기준으로 (from core.paths import … 가 테스트에서도 되게)
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
